name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Check formatting
        run: dart format --set-exit-if-changed .
      
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
      
      - name: Run tests
        run: flutter test --coverage
      
      - name: Comment on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ Code Quality Checks Passed
              
              All automated checks have passed:
              
              - ✅ Code formatting (dart format)
              - ✅ Static analysis (flutter analyze)
              - ✅ Unit tests (flutter test)
              
              **Manual Review Checklist:**
              - [ ] Offline-first pattern used
              - [ ] Error handling with try-catch
              - [ ] No hardcoded values (uses AppColors, AppTypography, etc.)
              - [ ] Correct file naming (lowercase_with_underscores)
              - [ ] Proper Riverpod usage (ref.watch in build, ref.read in callbacks)
              - [ ] Streams/subscriptions disposed
              - [ ] Const constructors used where possible
              
              Ready for merge after manual review! 🚀`
            });
      
      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ Code Quality Checks Failed
              
              Please fix the issues above before merging.
              
              **Common fixes:**
              - Run \`dart format .\` to fix formatting
              - Run \`flutter analyze\` to see lint issues
              - Run \`flutter test\` to debug failing tests`
            });
