name: road_guard
description: "RoadGuard - Your Digital Copilot for Road Safety in Ghana"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.4

# ============================================
# DEPENDENCIES
# ============================================
# Each dependency is chosen for a specific purpose.
# We follow YAGNI (You Ain't Gonna Need It) - only add what we need NOW.
# 
# TEACHING NOTE:
# Dependencies are external packages that add functionality.
# We import ONLY what we need for MVP Week 1:
# - State management (Riverpod)
# - Navigation (GoRouter)
# - Icons (Lucide)
# ============================================
dependencies:
  flutter:
    sdk: flutter

  # ==========================================
  # STATE MANAGEMENT
  # ==========================================
  # flutter_riverpod: Modern, compile-safe state management
  # WHY Riverpod over Provider/Bloc:
  # - Compile-time safety (catches errors before runtime)
  # - No BuildContext needed (can use anywhere)
  # - Better testing support
  # - Auto-dispose prevents memory leaks
  flutter_riverpod: ^2.6.1
  
  # riverpod_annotation: Code generation for cleaner Riverpod code
  # WHY: Less boilerplate, more readable providers
  riverpod_annotation: ^2.6.1

  # ==========================================
  # NAVIGATION
  # ==========================================
  # go_router: Declarative routing with deep linking support
  # WHY go_router over Navigator 2.0:
  # - Much simpler API
  # - Built-in deep linking
  # - Type-safe route parameters
  # - Works great with Riverpod
  go_router: ^14.8.1

  # ==========================================
  # UI COMPONENTS
  # ==========================================
  # lucide_icons: Beautiful, consistent icon set
  # WHY Lucide over Material Icons:
  # - Cleaner, more modern aesthetic
  # - Consistent stroke width
  # - Better for dark themes
  # - MIT licensed
  lucide_icons: ^0.257.0
  
  # gap: Simple widget for adding space between widgets
  # WHY: Cleaner than SizedBox(width: 16) everywhere
  # Usage: Gap(16) instead of SizedBox(height: 16)
  gap: ^3.0.1

  # ==========================================
  # LOCAL STORAGE
  # ==========================================
  # hive_flutter: Fast, lightweight key-value database
  # WHY Hive over SharedPreferences/SQLite:
  # - Much faster than SharedPreferences
  # - Simpler than SQLite for key-value storage
  # - Works offline (critical for our app)
  # - Supports complex objects with adapters
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0

  # ==========================================
  # LOCATION & SENSORS (Week 3)
  # ==========================================
  # geolocator: GPS location and speed tracking
  # WHY: Provides GPS Doppler velocity (more accurate than position delta)
  geolocator: ^14.0.0
  
  # permission_handler: Cross-platform permission management
  # WHY: Clean API for requesting location permissions
  permission_handler: ^12.0.0+1
  google_fonts: ^8.0.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^20.0.0
  sensors_plus: ^7.0.0
  source_gen: ^2.0.0
  uuid: ^4.5.2
  camera: ^0.11.4
  google_mlkit_text_recognition: ^0.15.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ==========================================
  # CODE QUALITY
  # ==========================================
  # flutter_lints: Recommended lint rules
  flutter_lints: ^6.0.0
  
  # riverpod_generator: Generates Riverpod code from annotations
  riverpod_generator: ^2.6.5
  
  # build_runner: Runs code generators
  build_runner: ^2.4.15
  
  # custom_lint: Riverpod-specific lint rules
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  mockito: ^5.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# ============================================
# FLUTTER CONFIGURATION
# ============================================
flutter:
  uses-material-design: true

  # ==========================================
  # ASSETS
  # ==========================================
  # Assets are files bundled with the app (images, fonts, etc.)
  # The trailing slash includes ALL files in that directory
  assets:
    - assets/images/
    - assets/icons/

  # ==========================================
  # CUSTOM FONTS
  # ==========================================
  # We use Inter for UI text and JetBrains Mono for numbers
  # 
  # TEACHING NOTE:
  # Fonts are specified by family name, and each weight is a separate file.
  # Flutter will automatically select the right weight based on TextStyle.fontWeight
  # 
  # TODO: Download fonts from Google Fonts and add to assets/fonts/
  # For now, the app will use system fallback fonts
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: JetBrains Mono
  #     fonts:
  #       - asset: assets/fonts/JetBrainsMono-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/JetBrainsMono-Bold.ttf
  #         weight: 700
